</style></head><body><main class="wrap"><h1>Parliamo! 🇮🇹</h1><p class="muted">Lyssna, förstå och läs din italienska replik högt. Ingen mikrofon behövs.</p><nav class="tabs" id="tabs"></nav><section class="panel"><div class="small" id="step"></div><div class="progress"><div id="bar"></div></div><h2 id="heading"></h2><div class="bubble person"><div class="small" id="role"></div><div class="it" id="line"></div><div class="sv" id="lineSv"></div><p><button id="listen">🔊 Lyssna igen</button></p></div><div class="bubble student"><div class="small">La tua risposta · Ditt svar</div><div class="it" id="reply"></div><div class="sv" id="replySv"></div><p><button id="listenReply" type="button" aria-label="Lyssna på ditt svar">🔊 Lyssna på svaret</button></p></div><div class="controls"><label><input type="checkbox" id="autoplay" checked> Automatisk uppläsning</label><label>Hastighet <select id="speed"><option value=".75">Långsam</option><option value=".9" selected>Normal</option><option value="1">Snabbare</option></select></label></div><div class="footer"><button id="prev">← Föregående</button><button class="primary" id="next">Nästa replik →</button></div></section><div class="grammar" aria-live="polite"><span class="small">Presente · <span id="verbTitle"></span></span><div id="conjugation"></div></div></main><script>

{title:"🏛️ Museum",heading:"Al museo",role:"L’addetta del museo",lines:[
["Buongiorno! Benvenuto al museo.","God dag! Välkommen till museet.","Buongiorno! Vorrei un biglietto, per favore.","God dag! Jag skulle vilja ha en biljett, tack."],

{"title":"🚗 Hyrbilsdisken","heading":"Al banco dell’autonoleggio","role":"L’addetto dell’autonoleggio","lines":[["Buongiorno! Ha una prenotazione?","God dag! Har ni en bokning?","Sì, ho prenotato un’auto a nome Berglund.","Ja, jag har bokat en bil i namnet Berglund."],["Posso vedere la patente e un documento d’identità?","Kan jag få se körkort och legitimation?","Certamente. Ecco la patente e il passaporto.","Självklart. Här är körkortet och passet."],["Ha una carta di credito intestata al conducente?","Har ni ett kreditkort i förarens namn?","Sì, questa carta è intestata a me.","Ja, det här kortet står i mitt namn."],["Preferisce un’auto con cambio manuale o automatico?","Föredrar ni en bil med manuell eller automatisk växellåda?","Va bene il cambio manuale, grazie.","Manuell växellåda går bra, tack."],["Vuole aggiungere un secondo conducente?","Vill ni lägga till en extra förare?","No, grazie. Guiderò soltanto io.","Nej tack. Det är bara jag som ska köra."],["L’auto ha il pieno. Deve restituirla con il pieno.","Bilen är fulltankad. Ni ska lämna tillbaka den fulltankad.","D’accordo. Dove posso ritirare l’auto?","Okej. Var kan jag hämta bilen?"],["La trova nel parcheggio B, posto ventiquattro.","Ni hittar den på parkering B, plats tjugofyra.","Grazie. Posso controllare eventuali danni prima di partire?","Tack. Kan jag kontrollera eventuella skador innan jag kör?"],["Certamente. Faccia delle foto e ci avvisi se nota qualcosa.","Självklart. Ta bilder och meddela oss om ni upptäcker något.","Perfetto. A che ora devo restituire l’auto?","Perfekt. Vilken tid ska jag lämna tillbaka bilen?"]]},
{"title":"🚆 På tåget","heading":"Sul treno","role":"Il controllore","lines":[["Buongiorno, biglietti per favore.","God dag, biljetterna tack.","Buongiorno. Ecco il mio biglietto sul telefono.","God dag. Här är min biljett i telefonen."],["Grazie. Posso vedere anche un documento?","Tack. Kan jag också få se en legitimation?","Certo, ecco il passaporto.","Visst, här är passet."],["Va a Siracusa?","Ska ni till Syrakusa?","Sì. Questo treno arriva direttamente a Siracusa?","Ja. Går det här tåget direkt till Syrakusa?"],["No, deve cambiare a Catania.","Nej, ni måste byta i Catania.","Quanto tempo ho per cambiare treno?","Hur lång tid har jag för att byta tåg?"],["Ha circa quindici minuti.","Ni har ungefär femton minuter.","Da quale binario parte il prossimo treno?","Från vilket spår avgår nästa tåg?"],["Di solito dal binario tre, ma controlli il tabellone.","Vanligtvis från spår tre, men kontrollera informationstavlan.","Grazie. Il treno è in orario?","Tack. Är tåget i tid?"],["Per ora sì. La prossima fermata è Catania Centrale.","Än så länge, ja. Nästa station är Catania Centrale.","Mi può avvisare quando arriviamo?","Kan ni säga till när vi kommer fram?"],["Certamente. Arriviamo tra dieci minuti.","Självklart. Vi är framme om tio minuter.","Grazie mille per l’aiuto!","Tack så mycket för hjälpen!"]]},

{"title":"👕 Klädaffären","heading":"Nel negozio di abbigliamento","role":"La commessa","lines":[["Buongiorno! Posso aiutarla?","God dag! Kan jag hjälpa er?","Sì, sto cercando una camicia leggera.","Ja, jag letar efter en tunn skjorta."],["Che taglia porta?","Vilken storlek har ni?","Di solito porto la taglia media.","Jag brukar ha storlek medium."],["Preferisce questa blu o quella bianca?","Föredrar ni den här blå eller den där vita?","Mi piace quella blu. Posso provarla?","Jag tycker om den blå. Får jag prova den?"],["Certamente. Il camerino è là in fondo.","Självklart. Provrummet ligger där längst bort.","Grazie. Avete anche una taglia più grande?","Tack. Har ni också en större storlek?"],["Sì, le porto una taglia grande.","Ja, jag hämtar en storlek large åt er.","Perfetto, grazie. Questa mi sta meglio.","Perfekt, tack. Den här passar mig bättre."],["Come le sembra?","Hur känns den?","Mi piace, ma quanto costa?","Jag tycker om den, men vad kostar den?"],["Costa trenta euro. Oggi c’è uno sconto del dieci per cento.","Den kostar trettio euro. I dag är det tio procents rabatt.","Benissimo. Allora la prendo.","Utmärkt. Då tar jag den."],["Vuole pagare con carta?","Vill ni betala med kort?","Sì, grazie. Posso avere lo scontrino?","Ja tack. Kan jag få kvittot?"]]},
{"title":"☕ Baren","heading":"Al bar","role":"Il barista","lines":[["Buongiorno! Cosa prende?","God dag! Vad får det lov att vara?","Un cappuccino e un cornetto, per favore.","En cappuccino och en croissant, tack."],["Il cornetto lo preferisce semplice o alla crema?","Föredrar ni croissanten naturell eller med vaniljkräm?","Alla crema, grazie.","Med vaniljkräm, tack."],["Vuole consumare al banco o al tavolo?","Vill ni äta och dricka vid disken eller vid ett bord?","Al banco, per favore.","Vid disken, tack."],["Desidera anche un bicchiere d’acqua?","Vill ni också ha ett glas vatten?","Sì, grazie. Acqua naturale.","Ja tack. Stilla vatten."],["Ecco il cappuccino. Attenzione, è caldo!","Här är cappuccinon. Se upp, den är varm!","Grazie! Quanto devo pagare?","Tack! Hur mycket ska jag betala?"],["Sono quattro euro e venti.","Det blir fyra euro och tjugo cent.","Posso pagare con carta?","Kan jag betala med kort?"],["Certamente. Avvicini la carta al lettore.","Självklart. Håll kortet mot kortläsaren.","Ecco fatto. È andato bene?","Så där. Fungerade det?"],["Sì, tutto a posto. Buona giornata!","Ja, allt är klart. Ha en bra dag!","Grazie, altrettanto! Arrivederci!","Tack detsamma! På återseende!"]]}];
let scene=0,step=0;const el=id=>document.getElementById(id);
function speak(text){if(!('speechSynthesis'in window))return;const t=window.speechSynthesis;t.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=Number(el('speed').value);const voices=t.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='it-it')||voices.find(v=>v.lang.toLowerCase().startsWith('it'))||null;t.speak(u)}

function render(){const s=scenes[scene],l=s.lines[step];el('tabs').replaceChildren(...scenes.map((x,i)=>{const b=document.createElement('button');b.textContent=x.title;b.className=i===scene?'active':'';b.onclick=()=>{scene=i;step=0;render()};return b}));el('step').textContent='Utbyte '+(step+1)+' av '+s.lines.length;el('bar').style.width=(100*(step+1)/s.lines.length)+'%';el('heading').textContent=s.heading;el('role').textContent=s.role;['line','lineSv','reply','replySv'].forEach((id,i)=>el(id).textContent=l[i]);const verb=selectedVerbs[scene][step], forms=verbs[verb], pronouns=['io','tu','lui','noi','voi','loro'];el('verbTitle').textContent=verb;el('conjugation').textContent=forms.map((f,i)=>pronouns[i]+' '+f).join(' · ');el('prev').disabled=step===0;el('next').textContent=step===s.lines.length-1?'↻ Börja om':'Nästa replik →';if(el('autoplay').checked)speak(l[0])}
