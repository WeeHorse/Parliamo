<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parliamo! 🇮🇹</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f7f6ef;color:#26382d;margin:0}.wrap{max-width:760px;margin:35px auto;padding:18px}h1{color:#26734e;font-size:2.6rem;margin-bottom:0}.muted{color:#69756c}.panel{background:white;border:1px solid #e4e8e0;border-radius:20px;padding:25px;box-shadow:0 8px 30px #00000009}.tabs,.controls,.footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tabs{margin:24px 0}button,select{font:inherit}button{border:0;background:#eaf0e9;color:#28543a;padding:12px 16px;border-radius:12px;cursor:pointer}button.active,button.primary{background:#27754f;color:white}button:disabled{opacity:.4;cursor:not-allowed}.bubble{padding:20px;border-radius:16px;margin:18px 0}.person{background:#edf4ee}.student{background:#f6efe4}.it{font-size:1.4rem;font-weight:650;line-height:1.5}.sv{color:#657269;margin-top:8px}.small{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:#64776b;margin-bottom:9px}.grammar{margin-top:15px;padding:14px 18px;background:#edf4ee;border-radius:14px;line-height:1.7}.grammar #conjugation{font-size:.95rem}.progress{height:7px;background:#e8ede7;border-radius:8px;margin:15px 0 22px}.progress div{height:100%;background:#31845b;border-radius:8px}.controls{margin-top:18px}.footer{justify-content:space-between;margin-top:22px}@media(max-width:500px){.wrap{margin:0;padding:12px}.panel{padding:16px}.it{font-size:1.2rem}}
</style></head><body><main class="wrap"><h1>Parliamo! 🇮🇹</h1><p class="muted">Lyssna, förstå och läs din italienska replik högt. Ingen mikrofon behövs.</p><nav class="tabs" id="tabs"></nav><section class="panel"><div class="small" id="step"></div><div class="progress"><div id="bar"></div></div><h2 id="heading"></h2><div class="bubble person"><div class="small" id="role"></div><div class="it" id="line"></div><div class="sv" id="lineSv"></div><p><button id="listen">🔊 Lyssna igen</button></p></div><div class="bubble student"><div class="small">La tua risposta · Ditt svar</div><div class="it" id="reply"></div><div class="sv" id="replySv"></div><p><button id="listenReply" type="button" aria-label="Lyssna på ditt svar">🔊 Lyssna på svaret</button></p></div><div class="controls"><label><input type="checkbox" id="autoplay" checked> Automatisk uppläsning</label><label>Hastighet <select id="speed"><option value=".75">Långsam</option><option value=".9" selected>Normal</option><option value="1">Snabbare</option></select></label></div><div class="footer"><button id="prev">← Föregående</button><button class="primary" id="next">Nästa replik →</button></div></section><div class="grammar" aria-live="polite"><span class="small">Presente · <span id="verbTitle"></span></span><div id="conjugation"></div></div></main><script>
const scenes=[
{title:"🍝 Restaurang",heading:"Al ristorante",role:"Il cameriere",lines:[
["Buonasera! Avete prenotato un tavolo?","God kväll! Har ni bokat bord?","No, non abbiamo prenotato. Avete un tavolo per due persone?","Nej, vi har inte bokat. Har ni ett bord för två personer?"],
["Certamente! Preferite stare dentro o fuori?","Absolut! Föredrar ni att sitta inne eller ute?","Fuori, per favore, se è possibile.","Ute, tack, om det är möjligt."],
["Ecco il menù. Volete qualcosa da bere?","Här är menyn. Vill ni ha något att dricka?","Sì, una bottiglia di acqua naturale, per favore.","Ja, en flaska stilla vatten, tack."],
["Avete già scelto cosa mangiare?","Har ni redan bestämt vad ni vill äta?","Vorrei la pasta alla norma, per favore.","Jag skulle vilja ha pasta alla norma, tack."],
["Desiderate anche un antipasto?","Vill ni också ha en förrätt?","No, grazie. Per me basta il primo piatto.","Nej tack. För mig räcker det med pastarätten."],
["Com’era la pasta? Tutto bene?","Hur var pastan? Var allt bra?","Era buonissima, grazie!","Den var jättegod, tack!"],
["Volete un dolce o un caffè?","Vill ni ha efterrätt eller kaffe?","Un caffè, per favore. E poi il conto.","En kaffe, tack. Och sedan notan."],
["Certo! Potete pagare con carta o in contanti.","Självklart! Ni kan betala med kort eller kontanter.","Pago con carta, grazie. Arrivederci!","Jag betalar med kort, tack. På återseende!"]]},
{title:"🛍️ Affär",heading:"In negozio",role:"La commessa",lines:[
["Buongiorno! Posso aiutarla?","God dag! Kan jag hjälpa er?","Sì, cerco un regalo per un amico.","Ja, jag letar efter en present till en vän."],
["Che tipo di regalo cerca?","Vilken sorts present letar ni efter?","Qualcosa di tipico della Sicilia.","Något typiskt från Sicilien."],
["Abbiamo delle ceramiche fatte a mano.","Vi har handgjord keramik.","Molto belle! Quanto costa questa tazza?","Mycket fina! Hur mycket kostar den här koppen?"],
["Costa quindici euro.","Den kostar femton euro.","Ne avete una di colore blu?","Har ni en blå?"],
["Sì, eccola qui. Le piace?","Ja, här är den. Tycker ni om den?","Sì, mi piace molto. La prendo.","Ja, jag tycker mycket om den. Jag tar den."],
["Vuole un pacchetto regalo?","Vill ni ha ett presentpaket?","Sì, grazie. È un regalo.","Ja tack. Det är en present."],
["Paga in contanti o con carta?","Betalar ni kontant eller med kort?","Con carta, per favore.","Med kort, tack."],
["Ecco lo scontrino. Buona giornata!","Här är kvittot. Ha en bra dag!","Grazie mille! Arrivederci!","Tack så mycket! På återseende!"]]},
{title:"🏛️ Museum",heading:"Al museo",role:"L’addetta del museo",lines:[
["Buongiorno! Benvenuto al museo.","God dag! Välkommen till museet.","Buongiorno! Vorrei un biglietto, per favore.","God dag! Jag skulle vilja ha en biljett, tack."],
["Un biglietto intero o ridotto?","En biljett till fullt eller reducerat pris?","Un biglietto intero, grazie.","En biljett till fullt pris, tack."],
["Vuole anche un’audioguida?","Vill ni också ha en audioguide?","Sì, è disponibile in italiano?","Ja, finns den på italienska?"],
["Certamente. Costa tre euro in più.","Självklart. Den kostar tre euro extra.","Va bene, la prendo.","Det går bra, jag tar den."],
["La mostra comincia nella sala a destra.","Utställningen börjar i salen till höger.","Grazie. Posso fare fotografie?","Tack. Får jag fotografera?"],
["Sì, ma senza flash, per favore.","Ja, men utan blixt, tack.","Capisco. Qual è l’opera più antica?","Jag förstår. Vilket är det äldsta verket?"],
["È una statua greca al primo piano.","Det är en grekisk staty på första våningen.","Interessante! Come posso arrivarci?","Intressant! Hur kommer jag dit?"],
["Prenda le scale in fondo al corridoio.","Ta trappan längst bort i korridoren.","Perfetto, grazie per l’aiuto!","Perfekt, tack för hjälpen!"]]}];
let scene=0,step=0;const el=id=>document.getElementById(id);
function speak(text){if(!('speechSynthesis'in window))return;const t=window.speechSynthesis;t.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=Number(el('speed').value);const voices=t.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='it-it')||voices.find(v=>v.lang.toLowerCase().startsWith('it'))||null;t.speak(u)}
const verbs={
avere:['ho','hai','ha','abbiamo','avete','hanno'],
preferire:['preferisco','preferisci','preferisce','preferiamo','preferite','preferiscono'],
volere:['voglio','vuoi','vuole','vogliamo','volete','vogliono'],
scegliere:['scelgo','scegli','sceglie','scegliamo','scegliete','scelgono'],
desiderare:['desidero','desideri','desidera','desideriamo','desiderate','desiderano'],
essere:['sono','sei','è','siamo','siete','sono'],
potere:['posso','puoi','può','possiamo','potete','possono'],
aiutare:['aiuto','aiuti','aiuta','aiutiamo','aiutate','aiutano'],
cercare:['cerco','cerchi','cerca','cerchiamo','cercate','cercano'],
costare:['costo','costi','costa','costiamo','costate','costano'],
piacere:['piaccio','piaci','piace','piacciamo','piacete','piacciono'],
pagare:['pago','paghi','paga','paghiamo','pagate','pagano'],
prendere:['prendo','prendi','prende','prendiamo','prendete','prendono'],
cominciare:['comincio','cominci','comincia','cominciamo','cominciate','cominciano'],
fare:['faccio','fai','fa','facciamo','fate','fanno'],
capire:['capisco','capisci','capisce','capiamo','capite','capiscono'],
arrivare:['arrivo','arrivi','arriva','arriviamo','arrivate','arrivano']
};
const selectedVerbs=[
['avere','preferire','volere','scegliere','desiderare','essere','volere','potere'],
['potere','cercare','avere','costare','piacere','volere','pagare','avere'],
['essere','essere','volere','costare','cominciare','potere','essere','prendere']
];
function render(){const s=scenes[scene],l=s.lines[step];el('tabs').replaceChildren(...scenes.map((x,i)=>{const b=document.createElement('button');b.textContent=x.title;b.className=i===scene?'active':'';b.onclick=()=>{scene=i;step=0;render()};return b}));el('step').textContent='Utbyte '+(step+1)+' av '+s.lines.length;el('bar').style.width=(100*(step+1)/s.lines.length)+'%';el('heading').textContent=s.heading;el('role').textContent=s.role;['line','lineSv','reply','replySv'].forEach((id,i)=>el(id).textContent=l[i]);const verb=selectedVerbs[scene][step], forms=verbs[verb], pronouns=['io','tu','lui','noi','voi','loro'];el('verbTitle').textContent=verb;el('conjugation').textContent=forms.map((f,i)=>pronouns[i]+' '+f).join(' · ');el('prev').disabled=step===0;el('next').textContent=step===s.lines.length-1?'↻ Börja om':'Nästa replik →';if(el('autoplay').checked)speak(l[0])}
el('listen').onclick=()=>speak(scenes[scene].lines[step][0]);el('listenReply').onclick=()=>speak(scenes[scene].lines[step][2]);el('prev').onclick=()=>{if(step){step--;render()}};el('next').onclick=()=>{step=(step+1)%scenes[scene].lines.length;render()};render();
</script></body></html>
